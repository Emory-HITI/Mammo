<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Whack-a-mole, dark amber and cyan theme">
  <defs>
    <linearGradient id="moleA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7AC51"/><stop offset="1" stop-color="#C98A2E"/>
    </linearGradient>
    <linearGradient id="moleC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FCBDA"/><stop offset="1" stop-color="#4E9AAB"/>
    </linearGradient>
    <radialGradient id="holeG" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#0B0F14"/><stop offset="1" stop-color="#1B232D"/>
    </radialGradient>
    <clipPath id="lip1"><rect x="55" y="252" width="160" height="70"/></clipPath>
    <clipPath id="lip2"><rect x="220" y="286" width="160" height="70"/></clipPath>
    <clipPath id="lip3"><rect x="368" y="248" width="160" height="70"/></clipPath>
  </defs>

  <!-- ===== hole cavities (back) ===== -->
  <g>
    <ellipse cx="135" cy="252" rx="78" ry="27" fill="none" stroke="#2A333D" stroke-width="3"/>
    <ellipse cx="135" cy="252" rx="72" ry="24" fill="url(#holeG)"/>
    <ellipse cx="300" cy="286" rx="78" ry="27" fill="none" stroke="#2A333D" stroke-width="3"/>
    <ellipse cx="300" cy="286" rx="72" ry="24" fill="url(#holeG)"/>
    <ellipse cx="448" cy="248" rx="78" ry="27" fill="none" stroke="#2A333D" stroke-width="3"/>
    <ellipse cx="448" cy="248" rx="72" ry="24" fill="url(#holeG)"/>
  </g>

  <!-- ===== mole 1 — popped up (amber) ===== -->
  <g>
    <ellipse cx="135" cy="206" rx="50" ry="58" fill="url(#moleA)"/>
    <ellipse cx="135" cy="222" rx="30" ry="34" fill="#F4D08C" opacity=".5"/>
    <ellipse cx="92" cy="244" rx="14" ry="10" fill="#C98A2E"/>
    <ellipse cx="178" cy="244" rx="14" ry="10" fill="#C98A2E"/>
    <circle cx="121" cy="196" r="9" fill="#0F141A"/><circle cx="123.6" cy="193.2" r="2.8" fill="#ECEFF3"/>
    <circle cx="149" cy="196" r="9" fill="#0F141A"/><circle cx="151.6" cy="193.2" r="2.8" fill="#ECEFF3"/>
    <ellipse cx="135" cy="216" rx="14" ry="11" fill="#FBE9C8"/>
    <ellipse cx="135" cy="213" rx="5" ry="3.6" fill="#0F141A"/>
    <line x1="135" y1="216" x2="135" y2="226" stroke="#0F141A" stroke-width="1.7"/>
    <g stroke="#5C6975" stroke-width="1.3"><line x1="110" y1="214" x2="86" y2="210"/><line x1="110" y1="219" x2="86" y2="221"/><line x1="160" y1="214" x2="184" y2="210"/><line x1="160" y1="219" x2="184" y2="221"/></g>
  </g>

  <!-- ===== mole 2 — peeking (down) ===== -->
  <g>
    <ellipse cx="300" cy="278" rx="42" ry="40" fill="url(#moleA)"/>
    <circle cx="288" cy="272" r="7" fill="#0F141A"/><circle cx="312" cy="272" r="7" fill="#0F141A"/>
    <ellipse cx="300" cy="286" rx="9" ry="7" fill="#FBE9C8"/>
  </g>

  <!-- ===== mole 3 — whacked (cyan), dazed ===== -->
  <g>
    <ellipse cx="448" cy="202" rx="50" ry="58" fill="url(#moleC)"/>
    <ellipse cx="448" cy="218" rx="30" ry="34" fill="#BCE6EE" opacity=".45"/>
    <ellipse cx="405" cy="240" rx="14" ry="10" fill="#4E9AAB"/>
    <ellipse cx="491" cy="240" rx="14" ry="10" fill="#4E9AAB"/>
    <g stroke="#0F141A" stroke-width="2.6" stroke-linecap="round">
      <line x1="426" y1="188" x2="438" y2="200"/><line x1="438" y1="188" x2="426" y2="200"/>
      <line x1="458" y1="188" x2="470" y2="200"/><line x1="470" y1="188" x2="458" y2="200"/>
    </g>
    <ellipse cx="448" cy="214" rx="13" ry="10" fill="#E6F5F8"/>
    <ellipse cx="448" cy="212" rx="4.5" ry="3.4" fill="#0F141A"/>
  </g>

  <!-- ===== front lips (drawn over mole bases) + amber rims ===== -->
  <g clip-path="url(#lip1)"><ellipse cx="135" cy="252" rx="74" ry="25" fill="#161D26"/></g>
  <path d="M63 252 A72 24 0 0 1 207 252" fill="none" stroke="#E7AC51" stroke-width="2" stroke-opacity=".55"/>
  <g clip-path="url(#lip2)"><ellipse cx="300" cy="286" rx="74" ry="25" fill="#161D26"/></g>
  <path d="M228 286 A72 24 0 0 1 372 286" fill="none" stroke="#E7AC51" stroke-width="2" stroke-opacity=".45"/>
  <g clip-path="url(#lip3)"><ellipse cx="448" cy="248" rx="74" ry="25" fill="#161D26"/></g>
  <path d="M376 248 A72 24 0 0 1 520 248" fill="none" stroke="#E7AC51" stroke-width="2" stroke-opacity=".55"/>

  <!-- ===== impact burst at contact point (mole's upper-right) ===== -->
  <g stroke="#D9785B" stroke-width="3" stroke-linecap="round">
    <line x1="486" y1="150" x2="498" y2="136"/>
    <line x1="466" y1="146" x2="470" y2="128"/>
    <line x1="506" y1="166" x2="524" y2="160"/>
  </g>
  <text x="525" y="140" font-family="SFMono-Regular,Menlo,monospace" font-size="22" font-weight="bold" fill="#E7AC51">!</text>

  <!-- ===== mallet — swung in from the upper-right (handle clear of the mole) ===== -->
  <g transform="translate(476 162) rotate(-31)">
    <rect x="46" y="-7" width="150" height="14" rx="7" fill="#5C6975"/>
    <rect x="46" y="-7" width="150" height="14" rx="7" fill="none" stroke="#9DA9B5" stroke-width="1" stroke-opacity=".5"/>
    <rect x="-52" y="-29" width="104" height="58" rx="14" fill="url(#moleA)" stroke="#C98A2E" stroke-width="2"/>
    <rect x="-52" y="-29" width="104" height="17" rx="9" fill="#F4D08C" opacity=".5"/>
  </g>
</svg>
